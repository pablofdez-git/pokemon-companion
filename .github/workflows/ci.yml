# Comprueba cada push y pull request, y publica una Release al subir una etiqueta v*
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Los tests abren un VS Code de prueba: en Linux necesita una pantalla virtual
      - run: xvfb-run -a npm test

      - name: La etiqueta coincide con la versión de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de package.json"
            exit 1
          fi

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      # Las notas de la Release son la sección de esta versión en el CHANGELOG
      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Ctrl+Catch ${{ github.ref_name }}
          body_path: notes.md
          files: '*.vsix'
